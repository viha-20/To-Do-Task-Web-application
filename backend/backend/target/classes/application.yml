spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db
    username: todo_user
    password: todo_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

server:
  port: 8080

logging:
  level:
    com.todo: DEBUG